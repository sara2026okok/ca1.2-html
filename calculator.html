<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f8;
      text-align: center;
      padding: 40px;
    }
    h1 {
      color: #1e3a5f;
    }
    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      color: #333;
    }
    input {
      padding: 8px;
      width: 150px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 8px 18px;
      margin: 4px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #2563eb;
    }
    #result {
      font-size: 24px;
      font-weight: bold;
      margin-top: 28px;
      color: #1e3a5f;
    }
  </style>
</head>
<body>

  <h1>Simple Calculator</h1>

  <label>First number:</label>
  <input id="num1" type="number">

  <label>Second number:</label>
  <input id="num2" type="number">

  <button onclick="calculate('+')">+</button>
  <button onclick="calculate('-')">−</button>
  <button onclick="calculate('*')">×</button>
  <button onclick="calculate('/')">÷</button>

  <p id="result">Result will appear here</p>

  <script>
    function calculate(operator) {
      var a = Number(document.getElementById("num1").value);
      var b = Number(document.getElementById("num2").value);

      var answer;

      if (operator === "+") {
        answer = a + b;
      } else if (operator === "-") {
        answer = a - b;
      } else if (operator === "*") {
        answer = a * b;
      } else if (operator === "/") {
        answer = a / b;
      }

      document.getElementById("result").textContent = "Answer: " + answer;
    }
  </script>

</body>
</html>
